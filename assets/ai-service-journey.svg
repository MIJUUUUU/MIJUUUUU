<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Miju's AI Service Journey</title>
  <desc id="desc">A cute map showing the journey from user interface to AI service, data and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F9A8D4"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#312E81" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 30px ui-sans-serif,system-ui,sans-serif;fill:#312E81}
      .sub{font:500 15px ui-sans-serif,system-ui,sans-serif;fill:#6B7280}
      .label{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:#312E81}
      .small{font:500 13px ui-sans-serif,system-ui,sans-serif;fill:#6B7280}
      .emoji{font:28px 'Apple Color Emoji','Segoe UI Emoji',sans-serif}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="42" fill="#FDE68A" opacity=".65"/>
  <circle cx="1020" cy="105" r="7" fill="#F9A8D4"/><circle cx="1105" cy="145" r="9" fill="#A7F3D0"/>
  <text x="60" y="62" class="title">Miju's AI Service Journey 🚀</text>
  <text x="60" y="91" class="sub">문제를 발견하고, 데이터로 이해하고, AI 서비스로 전달합니다.</text>

  <path d="M145 245 C260 145 330 350 450 250 S650 145 755 260 S930 350 1060 245" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M145 245 C260 145 330 350 450 250 S650 145 755 260 S930 350 1060 245" fill="none" stroke="url(#path)" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>

  <g filter="url(#shadow)">
    <rect x="55" y="350" width="190" height="145" rx="24" fill="#FFFFFF"/>
    <rect x="275" y="125" width="205" height="145" rx="24" fill="#FFFFFF"/>
    <rect x="505" y="350" width="210" height="145" rx="24" fill="#FFFFFF"/>
    <rect x="740" y="125" width="205" height="145" rx="24" fill="#FFFFFF"/>
    <rect x="965" y="350" width="180" height="145" rx="24" fill="#FFFFFF"/>
  </g>

  <text x="82" y="395" class="emoji">👩🏻‍💻</text><text x="125" y="397" class="label">User</text>
  <text x="82" y="425" class="small">문제를 발견하고</text><text x="82" y="447" class="small">서비스를 사용해요</text>

  <text x="302" y="170" class="emoji">🎨</text><text x="345" y="172" class="label">Frontend</text>
  <text x="302" y="205" class="small">React · Vue</text><text x="302" y="228" class="small">Tailwind CSS</text>

  <text x="532" y="395" class="emoji">🧠</text><text x="575" y="397" class="label">AI Core</text>
  <text x="532" y="425" class="small">LLM · RAG</text><text x="532" y="447" class="small">OpenAI API · FastAPI</text>

  <text x="767" y="170" class="emoji">🗃️</text><text x="810" y="172" class="label">Data Garden</text>
  <text x="767" y="205" class="small">PostgreSQL · MongoDB</text><text x="767" y="228" class="small">Redis · Vector DB</text>

  <text x="992" y="395" class="emoji">☁️</text><text x="1035" y="397" class="label">Deploy</text>
  <text x="992" y="425" class="small">AWS · Docker</text><text x="992" y="447" class="small">GitHub Actions</text>

  <g fill="#FFFFFF" stroke="#F9A8D4" stroke-width="3"><circle cx="180" cy="205" r="13"/><circle cx="520" cy="205" r="13"/><circle cx="865" cy="340" r="13"/></g>
  <text x="60" y="570" class="sub">✨ 작은 문제를 발견하고 → 연결하고 → 쓸모 있는 AI 기능으로 만들어요.</text>
</svg>
